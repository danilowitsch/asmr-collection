name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python server (compile + smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python sources
        run: python -m py_compile server.py scripts/validate_data.py scripts/smoke_test.py

      - name: Run server smoke test (Flask test client, no network)
        run: python scripts/smoke_test.py

  data:
    name: Validate asmr_data.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate data file structure
        run: python scripts/validate_data.py asmr_data.json

  frontend:
    name: Frontend syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Syntax-check app.js
        run: node --check scripts/app.js
